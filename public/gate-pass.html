<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gate Pass — UniHostel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pass-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    /* Header */
    .pass-header {
      background: #1e3a5f;
      color: white;
      padding: 20px 24px;
      text-align: center;
    }
    .pass-header h1 { font-size: 22px; margin-bottom: 4px; }
    .pass-header p  { font-size: 13px; opacity: 0.8; }

    /* Status badge */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-pending  { background: #fef3c7; color: #92400e; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .status-out      { background: #dbeafe; color: #1e40af; }
    .status-returned { background: #f3f4f6; color: #374151; }

    /* QR section */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .qr-section img {
      width: 200px;
      height: 200px;
      border: 4px solid #1e3a5f;
      border-radius: 12px;
      padding: 4px;
    }
    .qr-label {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    /* Student info */
    .info-section { padding: 20px 24px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #6b7280; font-size: 12px; min-width: 110px; }
    .info-value { color: #1f2937; font-weight: 500; text-align: right; }

    /* Action buttons */
    .action-section {
      padding: 16px 24px 24px;
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-out      { background: #ef4444; color: white; }
    .btn-in       { background: #10b981; color: white; }
    .btn-print    { background: #1e3a5f; color: white; }
    .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

    /* Loading / error */
    .loading, .error-msg {
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }
    .error-msg { color: #dc2626; }

    /* Footer */
    .pass-footer {
      background: #f9fafb;
      padding: 12px 24px;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
    }

    @media print {
      body { background: white; }
      .action-section, .pass-footer { display: none; }
      .pass-card { box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="pass-card" id="passCard">
  <div class="loading">Loading gate pass...</div>
</div>

<script>
  // Get nightout ID from URL  →  /gate-pass.html?id=xxxxxx
  const params   = new URLSearchParams(window.location.search);
  const nightoutId = params.get('id');
  const token = localStorage.getItem('hostelToken');

  if (!nightoutId) {
    document.getElementById('passCard').innerHTML = `<div class="error-msg">❌ No gate pass ID provided.</div>`;
  } else {
    loadPass();
  }

  async function loadPass() {
    try {
      const res  = await fetch(`/api/nightout/${nightoutId}/qr`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();

      if (!data.success) {
        document.getElementById('passCard').innerHTML =
          `<div class="error-msg">❌ ${data.message}</div>`;
        return;
      }

      renderPass(data);

    } catch (err) {
      document.getElementById('passCard').innerHTML =
        `<div class="error-msg">❌ Failed to load gate pass. Please try again.</div>`;
    }
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function getStatusClass(status) {
    const map = { approved: 'status-approved', pending: 'status-pending', rejected: 'status-rejected', out: 'status-out', returned: 'status-returned' };
    return map[status] || 'status-pending';
  }

  function getStatusLabel(status) {
    const map = { approved: '✅ APPROVED — Ready to use', pending: '⏳ PENDING APPROVAL', rejected: '❌ REJECTED', out: '🚶 STUDENT IS OUTSIDE', returned: '🏠 STUDENT RETURNED' };
    return map[status] || status.toUpperCase();
  }

  function renderPass(data) {
    const isGateStaff = true; // In a real app, check role from JWT

    document.getElementById('passCard').innerHTML = `
      <div class="pass-header">
        <h1>🏠 UniHostel</h1>
        <p>Night-Out Gate Pass</p>
      </div>

      <div class="status-bar ${getStatusClass(data.status || 'approved')}">
        ${getStatusLabel(data.status || 'approved')}
      </div>

      <div class="qr-section">
        <img src="${data.qrCode}" alt="Gate Pass QR Code" id="qrImg"/>
        <p class="qr-label">Show this QR to gate staff for entry/exit</p>
      </div>

      <div class="info-section">
        <div class="info-row">
          <span class="info-label">Student Name</span>
          <span class="info-value">${data.studentName}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Roll Number</span>
          <span class="info-value">${data.rollNumber}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Room Number</span>
          <span class="info-value">${data.roomNumber}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Destination</span>
          <span class="info-value">${data.destination}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Departure</span>
          <span class="info-value">${formatDate(data.outDate)} at ${data.outTime}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Return By</span>
          <span class="info-value">${formatDate(data.returnDate)} at ${data.returnTime}</span>
        </div>
      </div>

      <div class="action-section">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print Pass</button>
        <button class="btn btn-out" onclick="markOut('${nightoutId}')">Mark OUT</button>
        <button class="btn btn-in"  onclick="markIn('${nightoutId}')">Mark IN</button>
      </div>

      <div class="pass-footer">
        This pass is valid only for the approved dates. Misuse will lead to disciplinary action.
      </div>
    `;
  }

  async function markOut(id) {
    if (!confirm('Mark this student as OUT?')) return;
    const res  = await fetch(`/api/gate/out/${id}`, { method: 'PUT' });
    const data = await res.json();
    alert(data.message);
    if (data.success) loadPass();
  }

  async function markIn(id) {
    if (!confirm('Mark this student as returned IN?')) return;
    const res  = await fetch(`/api/gate/in/${id}`, { method: 'PUT' });
    const data = await res.json();
    alert(data.message);
    if (data.success) loadPass();
  }
</script>

</body>
</html>
